<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudySphere — Academic Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/glass.css') }}">
</head>
<body class="p-3 md:p-6 flex items-center justify-center">

    <div class="app-shell w-full max-w-[1440px] min-h-[88vh] p-4 md:p-6 flex flex-col lg:flex-row gap-6">
        
        <!-- LEFT BLUE SIDEBAR (Matches Template) -->
        <aside class="blue-sidebar w-full lg:w-64 p-5 text-white flex flex-col justify-between shrink-0">
            <div>
                <!-- Brand Logo -->
                <div class="flex items-center gap-3 px-2 mb-8">
                    <div class="w-9 h-9 bg-white/20 rounded-xl flex items-center justify-center font-bold text-lg">S</div>
                    <span class="text-lg font-bold tracking-tight">StudySphere</span>
                </div>

                <!-- Navigation Menu -->
                <nav class="space-y-2 text-sm">
                    <a href="{{ url_for('dashboard') }}" class="flex items-center gap-3 px-4 py-3 rounded-xl {{ 'nav-item-active' if active_page == 'dashboard' else 'text-white/85 hover:bg-white/10' }}">
                        <span>Dashboard</span>
                    </a>
                    <a href="#subjects" class="flex items-center gap-3 px-4 py-3 rounded-xl text-white/85 hover:bg-white/10">
                        <span>Subjects & Notes</span>
                    </a>
                    <a href="#assignments" class="flex items-center gap-3 px-4 py-3 rounded-xl text-white/85 hover:bg-white/10">
                        <span>Assignments</span>
                    </a>
                    <a href="#cgpa" class="flex items-center gap-3 px-4 py-3 rounded-xl text-white/85 hover:bg-white/10">
                        <span>CGPA 8.0+ Predictor</span>
                    </a>
                    <a href="#attendance" class="flex items-center gap-3 px-4 py-3 rounded-xl text-white/85 hover:bg-white/10">
                        <span>Attendance Tracker</span>
                    </a>
                    <a href="#routines" class="flex items-center gap-3 px-4 py-3 rounded-xl text-white/85 hover:bg-white/10">
                        <span>Daily Routine</span>
                    </a>
                    <a href="#projects" class="flex items-center gap-3 px-4 py-3 rounded-xl text-white/85 hover:bg-white/10">
                        <span>Group Projects</span>
                    </a>
                </nav>
            </div>

            <!-- Bottom Sidebar Pomodoro Focus Widget (Replaces Upgrade Card) -->
            <div x-data="{ seconds: 1500, running: false, timer: null,
                toggle() {
                    if (this.running) { clearInterval(this.timer); this.running = false; }
                    else {
                        this.running = true;
                        this.timer = setInterval(() => { if(this.seconds > 0) this.seconds--; }, 1000);
                    }
                },
                format() {
                    let m = Math.floor(this.seconds / 60);
                    let s = this.seconds % 60;
                    return `${m}:${s < 10 ? '0' : ''}${s}`;
                }
            }" class="mt-8 bg-white/15 backdrop-blur-md rounded-2xl p-4 text-center border border-white/25">
                <p class="text-xs uppercase tracking-wider text-blue-100 font-semibold">Focus Timer</p>
                <div class="text-2xl font-bold my-2" x-text="format()">25:00</div>
                <button @click="toggle()" class="w-full py-2 bg-[#25b89a] hover:bg-[#1fa388] text-white text-xs font-semibold rounded-xl shadow transition" x-text="running ? 'Pause Session' : 'Start Focus'">
                    Start Focus
                </button>
            </div>
        </aside>

        <!-- MAIN WORKSPACE -->
        <main class="flex-1 flex flex-col">
            <!-- Top Header Bar -->
            <header class="flex flex-wrap items-center justify-between gap-4 mb-6">
                <!-- Search Pill -->
                <div class="relative w-full sm:w-80">
                    <input type="text" placeholder="Search subjects, notes, tasks..." class="w-full bg-white/80 border border-white rounded-full py-2.5 px-5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 shadow-sm">
                </div>

                <!-- Right Action Button & User Profile Pill -->
                <div class="flex items-center gap-3 ml-auto">
                    <button onclick="document.getElementById('quickModal').classList.remove('hidden')" class="bg-[#1b86dc] hover:bg-[#1572be] text-white text-xs font-semibold px-4 py-2.5 rounded-xl shadow-md transition">
                        {{ '+ Create Assignment' if current_user.role == 'professor' else '+ Submit Assignment' }}
                    </button>

                    <div class="bg-white/90 px-3.5 py-1.5 rounded-xl flex items-center gap-2.5 shadow-sm border border-white">
                        <div class="w-7 h-7 rounded-lg bg-blue-600 text-white flex items-center justify-center text-xs font-bold">
                            {{ current_user.full_name[0] }}
                        </div>
                        <div class="text-xs">
                            <p class="font-semibold text-slate-800">{{ current_user.full_name }}</p>
                            <p class="text-[10px] text-slate-400 capitalize">{{ current_user.role }}</p>
                        </div>
                        <a href="{{ url_for('logout') }}" class="ml-2 text-xs text-red-500 hover:underline">Exit</a>
                    </div>
                </div>
            </header>

            <!-- Page Content -->
            {% block content %}{% endblock %}
        </main>
    </div>

</body>
</html>
